name: ci

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: "3.11"

      - name: Compile Python sources (syntax check)
        run: python -m compileall -q benchbloom

      - name: Build C++ engine (g++)
        run: g++ -std=c++17 -O2 -Wall -Wextra -pedantic cpp/bloomdex.cpp -o cpp/bloomdex

      - name: Smoke test end-to-end orchestration
        run: |
          python -m benchbloom index \
            --ref examples/benchmark.jsonl \
            --subject examples/training.jsonl \
            --field text --k 128 --ngram 4 --threshold 0.4 \
            --engine cpp/bloomdex --out match.tsv
          python -m benchbloom report match.tsv
