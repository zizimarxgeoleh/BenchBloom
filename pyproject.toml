[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[project]
name = "BenchBloom"
version = "5.3.0"
description = "Benchmark contamination detector: Python orchestrator + C++17 MinHash engine"
readme = "README.md"
requires-python = ">=3.8"
license = { file = "LICENSE" }
authors = [{ name = "BenchBloom contributors" }]
keywords = ["benchmark", "contamination", "leakage", "minhash", "jaccard", "ngram", "dedup"]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: C++",
    "Topic :: Scientific/Engineering",
]
dependencies = []

